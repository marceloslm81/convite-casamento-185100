    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-display {
      font-family: 'Playfair Display', Georgia, serif;
    }
    html {
      scroll-behavior: smooth;
    }
    @keyframes petalFall {
      0% {
        transform: translateY(-10vh) translateX(0px) rotate(0deg) scale(1);
        opacity: 0;
      }
      8% {
        opacity: 0.7;
      }
      25% {
        transform: translateY(25vh) translateX(20px) rotate(180deg) scale(0.9);
      }
      50% {
        transform: translateY(50vh) translateX(-15px) rotate(360deg) scale(1.05);
      }
      75% {
        transform: translateY(75vh) translateX(25px) rotate(540deg) scale(0.95);
        opacity: 0.5;
      }
      100% {
        transform: translateY(115vh) translateX(-10px) rotate(720deg) scale(0.8);
        opacity: 0;
      }
    }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(181,73,107,0.2); }
      50% { box-shadow: 0 0 40px rgba(181,73,107,0.4); }
    }
    .petal {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      animation: petalFall linear infinite;
    }
    .float-animation {
      animation: floatSoft 3s ease-in-out infinite;
    }
    .leaflet-container {
      border-radius: 1rem;
    }
  </style>
